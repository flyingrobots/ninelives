[package]
name = "ninelives"
version = "0.2.0"
edition = "2021"
authors = ["James Ross <james@flyingrobots.dev>"]
license = "Apache-2.0"
description = "Resilience primitives for async Rust: retry, circuit breaker, bulkhead, timeout, and composable stacks."
repository = "https://github.com/flyingrobots/ninelives"
readme = "README.md"
keywords = ["resilience", "retry", "circuit-breaker", "bulkhead", "timeout"]
categories = ["asynchronous", "network-programming"]
rust-version = "1.88"

[workspace]
members = [
    "ninelives-nats",
    "ninelives-kafka",
    "ninelives-elastic",
    "ninelives-etcd",
    "ninelives-prometheus",
    "ninelives-jsonl",
    "ninelives-otlp",
    "ninelives-cookbook",
]
resolver = "2"

[dependencies]
tokio = { version = "~1.54.1", features = ["time", "sync", "macros"] }
tracing = "~0.1.44"
rand = "~0.9.5"
async-trait = "~0.1.92"
tower-service = "0.3"
tower-layer = "0.3"
futures = "~0.3.34"
tower = { version = "0.5.3", features = ["full"] }

[dev-dependencies]
tokio = { version = "~1.54.1", features = ["full", "test-util"] }
tracing-subscriber = "~0.3.23"
futures = "~0.3.34"
